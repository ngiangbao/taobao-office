<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'">
<title>Taobao Office</title>
<style>
  :root{--bg:#14161c;--panel:#1b1e27;--line:#2a2e3a;--text:#e8eaf0;--mute:#8b90a0;--acc:#ff6a3d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none}
  body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Segoe UI",sans-serif;
       display:flex;align-items:center;justify-content:center}
  .card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 28px;text-align:center}
  img{width:104px;height:104px;border-radius:24px}
  h1{margin:0;font-size:19px;letter-spacing:.2px;font-weight:650}
  p{margin:0;color:var(--mute);font-size:12.5px;min-height:19px}
  .bar{width:190px;height:3px;border-radius:99px;background:var(--panel);overflow:hidden;position:relative}
  .bar::after{content:"";position:absolute;top:0;bottom:0;width:38%;border-radius:99px;background:var(--acc);
              animation:run 1.15s ease-in-out infinite}
  @keyframes run{0%{left:-40%}100%{left:100%}}
  .ver{position:fixed;right:12px;bottom:8px;font-size:11px;color:var(--mute)}
</style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="">
    <h1>Taobao Office</h1>
    <p id="msg">Đang khởi động…</p>
    <div class="bar"></div>
  </div>
  <div class="ver" id="ver"></div>
  <script src="splash.js"></script>
</body>
</html>
